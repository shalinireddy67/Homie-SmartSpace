<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homie SmartSpace | Smart home and IoT control dashboard</title>
    <meta name="description" content="Homie SmartSpace — Smart home and IoT control dashboard." />
    <!-- Prevent flash of unstyled theme -->
    <script>
      (function () {
        try {
          var stored =
            localStorage.getItem('homie_smartspace_theme') ||
            localStorage.getItem('homie_theme') ||
            localStorage.getItem('nestora_theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          /* Local storage may be restricted */
        }
      })();
    </script>
  </head>
  <body class="bg-surface text-text antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
